name: Release Windows x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nama tag untuk rilis (contoh: v0.16.0). Kosongkan jika ingin menggunakan commit hash.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows x64 & MSI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install WiX Toolset v5
        shell: pwsh
        run: |
          # Install WiX Toolset v5 sebagai .NET global tool (paling andal di CI)
          dotnet tool install -g wix
          wix --version

      - name: Build SolidCraft (Static CRT)
        shell: pwsh
        run: |
          # Aktifkan Static CRT agar tidak memerlukan VC++ Redistributable terpisah
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "-C target-feature=+crt-static"
          
          # Build aplikasi desktop dan CLI
          cargo build --release --locked -p solidcraft -p solidcraft-cli --target x86_64-pc-windows-msvc

      - name: Prepare Staging Directory & Build MSI
        shell: pwsh
        run: |
          # 1. Ekstrak versi dari Cargo.toml
          $CargoToml = Get-Content "Cargo.toml" -Raw
          if ($CargoToml -match '(?m)^\s*version\s*=\s*"([^"]+)"') {
              $Version = $Matches[1]
          } else {
              $Version = "${{ github.ref_name }}".TrimStart('v')
          }
          $MsiVersion = $Version.Split('-')[0]
          
          # 2. Tentukan path
          $Target = "x86_64-pc-windows-msvc"
          $BinDir = "target\$Target\release"
          $Stage = "target\windows-package\x64"
          $Dist = "dist"
          
          New-Item -ItemType Directory -Force -Path $Stage, $Dist | Out-Null
          
          # 3. Salin biner ke folder staging
          Copy-Item "$BinDir\solidcraft.exe", "$BinDir\solidcraft-cli.exe" $Stage
          if (Test-Path "$BinDir\solvecraft-cli.exe") { 
              Copy-Item "$BinDir\solvecraft-cli.exe" $Stage 
          }
          
          # 4. Salin file lisensi dan dokumentasi
          foreach ($f in @("LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "THIRD-PARTY-LICENSES.txt", "README.md")) {
              if (Test-Path $f) { Copy-Item $f $Stage }
          }
          
          # 5. Cari path ikon
          $IconPath = "assets/icons/app/windows/exports/solidcraft.ico"
          if (-not (Test-Path $IconPath)) {
              $FoundIcon = Get-ChildItem -Recurse -Filter "solidcraft.ico" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($FoundIcon) { $IconPath = $FoundIcon.FullName }
          }
          
          Write-Host "Building MSI for Version: $Version (MSI Version: $MsiVersion)"
          Write-Host "Using Icon: $IconPath"
          
          # 6. Jalankan perintah WiX Build
          wix build assets/platforms/windows/solidcraft.wxs -arch x64 `
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
            -culture en-US -loc assets/platforms/windows/solidcraft.en-us.wxl `
            -d "Version=$MsiVersion" -d "DisplayVersion=$Version" `
            -d "BinDir=$Stage" -d "IconPath=$IconPath" `
            -o "$Dist\solidcraft-$Version-windows-x64.msi"

      - name: Prepare Portable Zip & Standalone Exe
        shell: pwsh
        run: |
          $Dist = "dist"
          $Stage = "target\windows-package\x64"
          
          # Ekstrak versi untuk penamaan file
          $CargoToml = Get-Content "Cargo.toml" -Raw
          if ($CargoToml -match '(?m)^\s*version\s*=\s*"([^"]+)"') {
              $Version = $Matches[1]
          } else {
              $Version = "${{ github.ref_name }}".TrimStart('v')
          }
          
          # Buat arsip portable DENGAN VERSI di nama file
          $PortableDir = "target\windows-package\portable"
          New-Item -ItemType Directory -Force -Path $PortableDir | Out-Null
          Copy-Item "$Stage\*.exe" $PortableDir
          Copy-Item "$Stage\*.md", "$Stage\*.txt" $PortableDir -ErrorAction SilentlyContinue
          
          Compress-Archive -Path "$PortableDir\*" -DestinationPath "$Dist\solidcraft-$Version-windows-x64-portable.zip"
          
          # Salin executable utama DENGAN VERSI di nama file
          Copy-Item "$Stage\solidcraft.exe" -Destination "$Dist\SolidCraft-$Version-windows-x64.exe"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SolidCraft-windows-x64-release
          path: |
            dist/solidcraft-*-windows-x64.msi
            dist/solidcraft-*-windows-x64-portable.zip
            dist/SolidCraft-*-windows-x64.exe

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Release ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*
