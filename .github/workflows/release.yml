name: Release Windows x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nama tag untuk rilis (contoh: v0.16.0). Kosongkan jika ingin menggunakan commit hash.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build SolidCraft (Static CRT)
        shell: pwsh
        run: |
          # Aktifkan Static CRT agar tidak memerlukan VC++ Redistributable terpisah
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "-C target-feature=+crt-static"
          
          # Build aplikasi desktop dan CLI
          cargo build --release --locked -p solidcraft -p solidcraft-cli --target x86_64-pc-windows-msvc

      - name: Prepare Release Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          
          # Salin biner utama
          Copy-Item "target\x86_64-pc-windows-msvc\release\solidcraft.exe" -Destination "release\"
          Copy-Item "target\x86_64-pc-windows-msvc\release\solidcraft-cli.exe" -Destination "release\"
          
          # Salin alias kompatibilitas lama (jika ada)
          if (Test-Path "target\x86_64-pc-windows-msvc\release\solvecraft-cli.exe") {
            Copy-Item "target\x86_64-pc-windows-msvc\release\solvecraft-cli.exe" -Destination "release\"
          }
          
          # Salin lisensi dan dokumentasi
          $files = @("LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "THIRD-PARTY-LICENSES.txt", "README.md")
          foreach ($f in $files) {
            if (Test-Path $f) { Copy-Item $f -Destination "release\" }
          }

      - name: Compress Portable Zip
        shell: pwsh
        run: |
          # Buat arsip portable yang berisi semua biner dan lisensi
          Compress-Archive -Path "release\*" -DestinationPath "solidcraft-windows-x64-portable.zip"

      - name: Prepare Standalone Executable
        shell: pwsh
        run: |
          # Salin executable utama sebagai file unduhan tunggal yang mudah digunakan
          Copy-Item "release\solidcraft.exe" -Destination "SolidCraft-windows-x64.exe"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SolidCraft-windows-x64
          path: |
            solidcraft-windows-x64-portable.zip
            SolidCraft-windows-x64.exe

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Izin wajib untuk membuat Release dan mengunggah file
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Release ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: dist/*
